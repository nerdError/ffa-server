<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC2 FFA League | StarCraft II Ratings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zekton:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
</head>

<body>
    <header class="topbar">
        <h1>SC2 FFA LEAGUE <span class="subtitle">// PLAYER DATABASE</span></h1>
        <div id="user-box" class="user-box"></div>
    </header>

    <main id="app">
        <section id="screen-auth" class="screen hidden">
            <div class="card">
                <h2>Вход</h2>
                <form id="form-login" class="form">
                    <input type="text" name="identifier" placeholder="Email или никнейм" required
                        autocomplete="username" />
                    <input type="password" name="password" placeholder="Пароль" required minlength="6"
                        autocomplete="current-password" />
                    <button type="submit">Войти</button>
                </form>
                <p class="hint">Нет аккаунта? <a href="#" id="link-to-signup">Зарегистрироваться</a></p>
            </div>

            <div class="card hidden" id="card-signup">
                <h2>Регистрация</h2>
                <form id="form-signup" class="form">
                    <input type="text" name="username" placeholder="Никнейм (3-32 символа)" required minlength="3"
                        maxlength="32" pattern="[a-zA-Z0-9_.\-]+" title="Латинские буквы, цифры, _, ., -" />
                    <input type="email" name="email" placeholder="Email" required />
                    <input type="password" name="password" placeholder="Пароль (мин. 6)" required minlength="6" />
                    <button type="submit">Создать аккаунт</button>
                </form>
                <p class="hint">Уже есть аккаунт? <a href="#" id="link-to-login">Войти</a></p>
            </div>
        </section>

        <section id="screen-players" class="screen hidden">
            <div class="toolbar">
                <h2>Игроки</h2>
                <div class="toolbar-actions">
                    <input type="text" id="players-search" class="players-search"
                        placeholder="Поиск по имени или aka…" />
                    <div class="view-toggle" id="view-toggle">
                        <button type="button" class="view-toggle-btn is-active" data-view="table">☰ Таблица</button>
                        <button type="button" class="view-toggle-btn" data-view="wall">◈ Карточки</button>
                    </div>
                    <form id="form-create-player" class="inline-form">
                        <input type="text" name="name" placeholder="Имя нового игрока" required maxlength="100" />
                        <button type="submit">Добавить</button>
                    </form>
                </div>
            </div>

            <div id="players-error" class="error hidden"></div>

            <!-- Вид 1: таблица (существующая) -->
            <div id="players-table-view">
                <div class="players-table-wrap">
                    <table class="players-table">
                        <thead>
                            <tr>
                                <th data-sort-key="name" data-label="Игрок" id="col-players">Игрок</th>
                                <th class="col-mobile-hide" data-sort-key="races" data-label="Расы">Расы</th>

                                <!-- Десктопные колонки статов -->
                                <th class="col-desktop" data-sort-key="adaptiveness" data-label="Адаптивность">Адаптивность
                                </th>
                                <th class="col-desktop" data-sort-key="aggression" data-label="Агрессия">Агрессия</th>
                                <th class="col-desktop" data-sort-key="turtle" data-label="Черепашность">Черепашность</th>
                                <th class="col-desktop" data-sort-key="variety" data-label="Разнообразие">Разнообразие</th>
                                <th class="col-desktop" data-sort-key="survival" data-label="Выживание">Выживание</th>
                                <th class="col-desktop" data-sort-key="greed" data-label="Халява">Халява</th>

                                <!-- Мобильная колонка со статами (по умолчанию скрыта) -->
                                <th class="col-mobile">Статы</th>

                                <th data-sort-key="total" data-label="Итого" class="total-col col-mobile-hide">Итого</th>
                                <!-- <th class="players-actions-header"></th> -->
                            </tr>
                        </thead>
                        <tbody id="players-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Вид 2: стена со стилями игры -->
            <div id="players-wall-view" class="hidden">
                <div id="players-wall" class="players-wall"></div>
            </div>
        </section>

        <section id="screen-player" class="screen hidden">
            <button id="btn-back" class="btn-secondary">← Назад</button>

            <div class="player-stage" id="player-stage">
                <div class="player-card-pane" id="player-card-pane"></div>
                <aside class="player-edit-pane" id="player-edit-pane">
                    <div id="rating-form-container"></div>
                </aside>
            </div>

            <div class="player-actions" id="player-actions"></div>

            <div id="ratings-list-container" class="player-ratings-pane"></div>
        </section>

        <!-- Экран загрузки (показывается, пока валидируется токен) -->
        <section id="screen-loading" class="screen">
            <div class="loading-box">
                <div class="loading-spinner"></div>
                <div class="loading-text">ЗАГРУЗКА…</div>
            </div>
        </section>
    </main>

    </main>

    <footer class="site-footer">
        <div class="footer-line">
            Made by <span class="footer-author">nerdError</span>
            <span class="footer-year">2026</span>
        </div>
        <div class="footer-line">
            Inspired by <span class="footer-author2">Asfarion</span>
        </div>
        <div class="footer-contacts">
            <a class="footer-link footer-link--telegram" href="https://t.me/nerderror404" target="_blank"
                rel="noopener noreferrer">
                Telegram: @nerderror404
            </a>
            <span class="footer-sep">·</span>
            <button type="button" class="footer-link footer-link--discord" id="copy-discord" title="Скопировать тег">
                Discord: nerderror
            </button>
        </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
</body>

<script type="module" src="/src/main.ts"></script>
</body>

</html>
