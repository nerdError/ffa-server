<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Все игроки | SC2 FFA League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

      <h2>Стили игры всех игроков</h2>
      <p class="hint" id="players-wall-count"></p>
    </div>

    <div id="players-wall-error" class="error hidden"></div>

    <div id="players-wall" class="players-wall">
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-block"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-line">
      Made by <span class="footer-author">nerdError</span>
      <span class="footer-year">2026</span>
    </div>
    <div class="footer-contacts">
      <a
        class="footer-link footer-link--telegram"
        href="https://t.me/nerderror404"
        target="_blank"
        rel="noopener noreferrer"
      >Telegram: @nerderror404</a>
      <span class="footer-sep">·</span>
      <span class="footer-link footer-link--discord">Discord: nerderror</span>
